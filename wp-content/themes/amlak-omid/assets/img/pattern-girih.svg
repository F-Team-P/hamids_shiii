<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <!-- Tileable 8-pointed star (گره‌چینی) lattice. Gold strokes read well
       on both the cream sections (faint) and the dark tile frames (inlay). -->
  <defs>
    <g id="cell" fill="none" stroke="#c9a227" stroke-width="1.2" stroke-linejoin="round">
      <!-- central 8-point star -->
      <path d="M75,45 L56.09,49.59 L66.21,66.21 L49.59,56.09 L45,75
               L40.41,56.09 L23.79,66.21 L33.91,49.59 L15,45
               L33.91,40.41 L23.79,23.79 L40.41,33.91 L45,15
               L49.59,33.91 L66.21,23.79 L56.09,40.41 Z"/>
      <!-- spokes that connect to neighbouring tiles -->
      <path d="M75,45 H90 M15,45 H0 M45,75 V90 M45,15 V0
               M66.21,66.21 L90,90 M23.79,66.21 L0,90
               M23.79,23.79 L0,0 M66.21,23.79 L90,0"/>
    </g>
  </defs>
  <use href="#cell"/>
</svg>
