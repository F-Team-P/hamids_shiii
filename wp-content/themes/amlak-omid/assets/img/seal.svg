<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="نشان املاک امید، تأسیس ۱۳۵۴">
  <!-- Heritage medallion / seal — Persian eyvan arch + dome, est. ۱۳۵۴ -->
  <circle cx="50" cy="50" r="48" fill="#fffdf6" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42.5" fill="none" stroke="#0f8a8a" stroke-width="1.2" stroke-dasharray="2 3"/>
  <circle cx="50" cy="50" r="39" fill="#0f8a8a"/>

  <!-- dome + finial -->
  <path d="M44,32 Q50,22 56,32 Z" fill="#c9a227"/>
  <line x1="50" y1="26" x2="50" y2="20" stroke="#c9a227" stroke-width="1.6"/>
  <circle cx="50" cy="19" r="1.8" fill="#c9a227"/>

  <!-- pointed eyvan arch (the home) -->
  <path d="M36,64 V46 Q50,30 64,46 V64 Z" fill="#fffdf6"/>
  <path d="M41,64 V49 Q50,38 59,49 V64 Z" fill="#1b3a6b"/>
  <!-- key inside the doorway -->
  <g fill="#c9a227">
    <circle cx="50" cy="50" r="3"/>
    <rect x="49" y="52" width="2" height="10" rx="1"/>
    <rect x="51" y="58" width="3.4" height="2"/>
    <rect x="51" y="61" width="2.4" height="2"/>
  </g>

  <!-- base line -->
  <rect x="33" y="64" width="34" height="2.4" fill="#c9a227"/>

  <!-- est. year ribbon -->
  <text x="50" y="80" text-anchor="middle"
        font-family="Vazirmatn, Tahoma, sans-serif" font-size="9" font-weight="700"
        fill="#fffdf6">۱۳۵۴</text>
</svg>
