<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="نشان املاک امید، تأسیس ۱۳۵۴">
  <!-- Classic prestige crest — navy medallion, gold classical facade, est. ۱۳۵۴ -->
  <circle cx="50" cy="50" r="48" fill="#0d1b2a" stroke="#c9a227" stroke-width="2"/>
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#c9a227" stroke-width=".7"/>

  <!-- top finial -->
  <path d="M50,12 l3.2,4 -3.2,4 -3.2,-4 Z" fill="#c9a227"/>

  <!-- pediment + columns (classical facade) -->
  <g fill="none" stroke="#e6cf86" stroke-width="1.8" stroke-linejoin="round">
    <path d="M30,44 L50,31 L70,44"/>
  </g>
  <g stroke="#c9a227" stroke-width="2.4" stroke-linecap="round">
    <line x1="35" y1="46" x2="35" y2="63"/>
    <line x1="43" y1="46" x2="43" y2="63"/>
    <line x1="57" y1="46" x2="57" y2="63"/>
    <line x1="65" y1="46" x2="65" y2="63"/>
  </g>
  <rect x="31" y="45" width="38" height="2.4" fill="#e6cf86"/>
  <rect x="31" y="64" width="38" height="2.6" fill="#e6cf86"/>

  <!-- laurel flanks -->
  <g fill="none" stroke="#c9a227" stroke-width="1.2" stroke-linecap="round">
    <path d="M24,52 q-4,4 -2,10"/>
    <path d="M76,52 q4,4 2,10"/>
  </g>

  <!-- est. year -->
  <text x="50" y="81" text-anchor="middle" font-family="Amiri, Vazirmatn, serif" font-size="11" font-weight="700" fill="#e6cf86">۱۳۵۴</text>
</svg>
